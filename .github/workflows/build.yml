name: Gerar instalador

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar uma Release com a versão do package.json'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar instalador Windows (.exe)
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Enviar instalador
        uses: actions/upload-artifact@v4
        with:
          name: AsturCut-Instalador-Windows
          path: dist/*.exe
          retention-days: 30

  linux:
    # Ubuntu, Zorin OS, Linux Mint, Pop!_OS (.deb) e outras distros (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar pacotes Linux (.deb e AppImage)
        run: npx electron-builder --linux deb AppImage --publish never
      - name: Enviar pacotes
        uses: actions/upload-artifact@v4
        with:
          name: AsturCut-Linux
          path: |
            dist/*.deb
            dist/*.AppImage
          retention-days: 30

  android:
    # app para celular (APK leve, ~4 MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm ci
      - name: Preparar a versão de celular
        run: |
          node scripts/build-mobile.js
          npx cap sync android
      - name: Chave de assinatura do APK (guardada no cache do GitHub)
        uses: actions/cache@v4
        with:
          path: ~/.asturcut-signing
          key: asturcut-android-signing-v1
      - name: Gerar APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # 1) se você configurou os segredos ANDROID_KEYSTORE_*, usa a sua chave (recomendado: permanente)
          # 2) senão, usa uma chave gerada uma vez e guardada no cache do GitHub (as atualizações instalam por cima)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ANDROID_KEYSTORE_PASSWORD="$KS_PASS" ANDROID_KEY_ALIAS="${KS_ALIAS:-asturcut}"
          else
            D="$HOME/.asturcut-signing"; mkdir -p "$D"
            if [ ! -f "$D/release.jks" ]; then
              openssl rand -hex 24 > "$D/pass"
              keytool -genkeypair -keystore "$D/release.jks" -alias asturcut -keyalg RSA -keysize 2048 -validity 12000 \
                -storepass "$(cat "$D/pass")" -keypass "$(cat "$D/pass")" -dname "CN=AsturCut, O=AsturCut, C=BR"
            fi
            export ANDROID_KEYSTORE_FILE="$D/release.jks" ANDROID_KEYSTORE_PASSWORD="$(cat "$D/pass")" ANDROID_KEY_ALIAS=asturcut
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/AsturCut-$(node -p "require('../package.json').version").apk"
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: AsturCut-Android
          path: dist/*.apk
          retention-days: 30

  release:
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler versão
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar release (tag v* ou botão "publicar")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: AsturCut ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.apk
