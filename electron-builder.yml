# Configuração do instalador do AsturCut
appId: com.asturcut.editor
productName: AsturCut
copyright: Copyright © 2026 Matheus Astur
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
  - build/icon.png
  - "!**/*.map"
asarUnpack:
  - node_modules/ffmpeg-static/**
fileAssociations:
  - ext: astur
    name: Projeto AsturCut
    description: Projeto do editor AsturCut
    icon: build/icon.ico
    role: Editor
    mimeType: application/x-asturcut
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: AsturCut-Setup-${version}.${ext}
nsis:
  # instalador moderno: telas próprias (build/installer.nsh): boas-vindas -> progresso -> tudo pronto
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false   # o atalho é opcional, escolhido na tela do instalador
  createStartMenuShortcut: true
  shortcutName: AsturCut
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  multiLanguageInstaller: true
  installerLanguages: [en_US, pt_BR, es_ES]
  warningsAsErrors: false
  include: build/installer.nsh
linux:
  # Ubuntu, Zorin OS, Linux Mint, Pop!_OS... (.deb) e qualquer distro (AppImage)
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: AudioVideo
  executableName: asturcut
  syncDesktopName: true
  synopsis: Editor de vídeo para PC
  description: Editor de vídeo gratuito inspirado nos editores profissionais, com legendas automáticas, remover fundo, gravação de tela e muito mais.
  maintainer: Matheus Astur <matheusasturofc-del@users.noreply.github.com>
  vendor: Matheus Astur
  desktop:
    entry:
      Name: AsturCut
      GenericName: Editor de vídeo
      Keywords: video;editor;edição;vídeo;legendas;
      StartupWMClass: AsturCut
deb:
  artifactName: AsturCut-${version}-amd64.${ext}
  packageCategory: video
  priority: optional
  recommends:
    - espeak-ng
appImage:
  artifactName: AsturCut-${version}-x86_64.${ext}
mac:
  target: [dmg]
  icon: build/icon.png
  category: public.app-category.video
