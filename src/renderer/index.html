<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' astur: blob: data:; img-src 'self' astur: blob: data:; media-src 'self' astur: blob: data:; font-src 'self' astur: blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' astur: blob: data:" />
  <title>AsturCut</title>
  <link rel="icon" href="assets/logo.svg" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar"></header>
    <div id="home-view"></div>
    <main id="workspace">
      <div id="top-row">
        <section id="panel-library" class="panel" data-panel="library"></section>
        <div id="vs1" class="vsplit"></div>
        <section id="panel-player" class="panel" data-panel="player"></section>
        <div id="vs2" class="vsplit"></div>
        <section id="panel-inspector" class="panel" data-panel="inspector"></section>
      </div>
      <div id="hsplit" class="hsplit" title="Arraste para redimensionar (duplo clique: padrão)"></div>
      <section id="panel-timeline" class="panel"></section>
    </main>
  </div>
  <!-- filtros SVG usados pelo ajuste "Nitidez" -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="sharpen1"><feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -0.5 0 -0.5 3 -0.5 0 -0.5 0"/></filter>
    <filter id="sharpen2"><feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0"/></filter>
    <filter id="sharpen3"><feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="-1 -1 -1 -1 9 -1 -1 -1 -1"/></filter>
  </svg>
  <script type="module" src="js/app.js"></script>
</body>
</html>
